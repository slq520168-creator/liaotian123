name: Validate browser scripts

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published JavaScript
        run: |
          node --check roles.js
          node --check app.js
          node --check memory.js
          node --check role-code.js
          node -e "JSON.parse(require('fs').readFileSync('roles/new-role.role.json')); JSON.parse(require('fs').readFileSync('roles/preset-roles.json'))"
