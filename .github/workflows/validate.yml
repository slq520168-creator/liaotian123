name: Validate website and guides

on:
  # Production pushes are validated by deploy-cloudflare.yml; do not repeat them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: JavaScript, 3D runtime and website smoke tests
        run: |
          timeout --signal=TERM --kill-after=10s 120s npm test
          timeout --signal=TERM --kill-after=10s 150s node scripts/validate.mjs
          timeout --signal=TERM --kill-after=10s 120s npm run cf:build
          test -s dist/vendor/three/build/three.module.js
          test -s dist/vendor/three/build/three.core.js
          test -s dist/vendor/three/examples/jsm/loaders/GLTFLoader.js
          test -s dist/vendor/meshoptimizer/meshopt_decoder.mjs
          grep -Fq "REVISION = '186'" dist/vendor/three/build/three.core.js
