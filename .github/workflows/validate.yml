name: Validate website and guides

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run unit tests
        run: npm test
      - name: Check website, documentation, human assets and chat contract
        run: node scripts/validate.mjs
