name: Deploy Cloudflare production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production-main
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate site and 3D human assets
        run: |
          npm test
          node scripts/validate.mjs
          npm run cf:check

      - name: Detect Cloudflare deployment credentials
        id: cloudflare-auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy main to Cloudflare Workers
        if: steps.cloudflare-auth.outputs.ready == 'true'
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify sirole.vip full-body 3D presets
        if: steps.cloudflare-auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base='https://sirole.vip'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          expected_build="$(node -e "const s=require('fs').readFileSync('config/app.js','utf8');const m=s.match(/const version='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"

          wait_for_build() {
            local attempt
            for attempt in $(seq 1 30); do
              echo "Waiting for production build $expected_build ($attempt/30)"
              if curl -fsSL --retry 3 --retry-all-errors "$base/config/app.js?smoke=${GITHUB_SHA}-$attempt" -o "$tmp/config.js" \
                && test -s "$tmp/config.js" \
                && grep -Fq "$expected_build" "$tmp/config.js"; then
                echo "Production build is live: $expected_build"
                return 0
              fi
              sleep 2
            done
            echo "Production never switched to build $expected_build" >&2
            cat "$tmp/config.js" >&2 || true
            return 1
          }

          fetch_text() {
            local path="$1"
            local out="$2"
            local attempt
            for attempt in $(seq 1 10); do
              echo "Fetching $path ($attempt/10)"
              if curl -fsSL --retry 3 --retry-all-errors "$base/$path?smoke=${GITHUB_SHA}-$attempt" -o "$tmp/$out" && test -s "$tmp/$out"; then
                echo "Fetched $path ($(wc -c < "$tmp/$out") bytes)"
                return 0
              fi
              sleep 1
            done
            echo "Failed to fetch $path from production" >&2
            return 1
          }

          verify_http_200() {
            local path="$1"
            local attempt code
            for attempt in $(seq 1 10); do
              code="$(curl -sS -L -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$base/$path?smoke=${GITHUB_SHA}-$attempt" || true)"
              if [ "$code" = '200' ]; then
                echo "Verified $path HTTP $code"
                return 0
              fi
              sleep 1
            done
            echo "Production asset $path did not return HTTP 200" >&2
            return 1
          }

          wait_for_build

          fetch_text 'role-creator-animated-presets.js' 'presets.js'
          grep -Fq 'vendor/three/build/three.module.js' "$tmp/presets.js"
          grep -Fq 'vendor/meshoptimizer/meshopt_decoder.mjs' "$tmp/presets.js"
          grep -Fq 'setMeshoptDecoder' "$tmp/presets.js"
          grep -Fq 'MAX_ACTIVE=2' "$tmp/presets.js"
          grep -Fq 'assets/humans/reference-mpfb.glb' "$tmp/presets.js"
          if grep -Fq 'esm.sh' "$tmp/presets.js"; then echo 'Preset runtime still depends on esm.sh' >&2; exit 1; fi

          fetch_text 'vendor/three/build/three.module.js' 'three.js'
          grep -Fq "from './three.core.js'" "$tmp/three.js"
          fetch_text 'vendor/three/build/three.core.js' 'three-core.js'
          grep -Fq "REVISION = '186'" "$tmp/three-core.js"
          fetch_text 'vendor/three/examples/jsm/loaders/GLTFLoader.js' 'gltf-loader.js'
          grep -Fq 'class GLTFLoader' "$tmp/gltf-loader.js"
          grep -Fq "../../../build/three.module.js" "$tmp/gltf-loader.js"
          fetch_text 'vendor/three/examples/jsm/utils/SkeletonUtils.js' 'skeleton-utils.js'
          grep -Fq 'function clone' "$tmp/skeleton-utils.js"
          fetch_text 'vendor/meshoptimizer/meshopt_decoder.mjs' 'meshopt.mjs'
          grep -Fq 'MeshoptDecoder' "$tmp/meshopt.mjs"

          fetch_text 'role-human-renderer.js' 'renderer.js'
          grep -Fq 'class HumanRenderer' "$tmp/renderer.js"
          fetch_text 'role-human-asset-capability.js' 'capability.js'
          grep -Fq 'REQUIRED_CAPABILITIES' "$tmp/capability.js"
          fetch_text 'role-natural-pose.js' 'pose.js'
          grep -Fq 'const ENABLED = false' "$tmp/pose.js"
          fetch_text 'assets/humans/manifest.json' 'manifest.json'
          grep -Fq '"nuannuan"' "$tmp/manifest.json"

          verify_http_200 'assets/humans/reference-mpfb.glb'
          verify_http_200 'assets/humans/reference-vitruvian-morph.glb'
          echo "sirole.vip production full-body 3D presets verified: $expected_build"
