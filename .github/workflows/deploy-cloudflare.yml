name: Deploy Cloudflare production

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production-main
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate site and 3D human assets
        run: |
          npm test
          node scripts/validate.mjs
          npm run cf:check

      - name: Detect Cloudflare deployment credentials
        id: cloudflare-auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy main to Cloudflare Workers
        if: steps.cloudflare-auth.outputs.ready == 'true'
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify sirole.vip full-body 3D presets
        if: steps.cloudflare-auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base='https://sirole.vip'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          expected_build="$(node -e "const s=require('fs').readFileSync('config/app.js','utf8');const m=s.match(/const version='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"

          wait_for_build() {
            local attempt
            for attempt in $(seq 1 30); do
              echo "Waiting for production build $expected_build ($attempt/30)"
              if curl -fsSL --retry 3 --retry-all-errors "$base/config/app.js?smoke=${GITHUB_SHA}-$attempt" -o "$tmp/config.js" \
                && test -s "$tmp/config.js" \
                && grep -Fq "$expected_build" "$tmp/config.js"; then
                echo "Production build is live: $expected_build"
                return 0
              fi
              sleep 2
            done
            echo "Production never switched to build $expected_build" >&2
            cat "$tmp/config.js" >&2 || true
            return 1
          }

          fetch_text() {
            local path="$1"
            local out="$2"
            local attempt
            for attempt in $(seq 1 10); do
              if curl -fsSL --retry 3 --retry-all-errors "$base/$path?smoke=${GITHUB_SHA}-$attempt" -o "$out" && test -s "$out"; then
                return 0
              fi
              sleep 2
            done
            echo "Failed to fetch $path from production" >&2
            return 1
          }

          wait_for_build
          fetch_text 'vendor/three.module.js' "$tmp/three.module.js"
          fetch_text 'vendor/three.core.js' "$tmp/three.core.js"
          fetch_text 'vendor/GLTFLoader.js' "$tmp/GLTFLoader.js"
          fetch_text 'vendor/SkeletonUtils.js' "$tmp/SkeletonUtils.js"
          fetch_text 'vendor/meshopt_decoder.module.js' "$tmp/meshopt.js"
          fetch_text 'assets/humans/reference-mpfb.glb' "$tmp/reference-mpfb.glb"
          fetch_text 'assets/humans/reference-vitruvian-morph.glb' "$tmp/reference-vitruvian-morph.glb"

          grep -Fq "./three.core.js" "$tmp/three.module.js"
          grep -Fq "REVISION = '186'" "$tmp/three.core.js"
          grep -Fq "GLTFLoader" "$tmp/GLTFLoader.js"
          grep -Fq "clone" "$tmp/SkeletonUtils.js"
          grep -Fq "MeshoptDecoder" "$tmp/meshopt.js"
          test -s "$tmp/reference-mpfb.glb"
          test -s "$tmp/reference-vitruvian-morph.glb"
