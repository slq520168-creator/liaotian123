name: Deploy Cloudflare production

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cloudflare-production-main
  # New pushes cancel older queued/stalled validation runs.
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1


      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify real production chat completion
        run: node scripts/check-live-chat.mjs

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate site and 3D human assets
        run: |
          timeout --signal=TERM --kill-after=10s 120s npm test
          timeout --signal=TERM --kill-after=10s 150s node scripts/validate.mjs
          timeout --signal=TERM --kill-after=10s 120s npm run cf:check

      - name: Detect Cloudflare deployment credentials
        id: cloudflare-auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy main to Cloudflare Workers
        if: steps.cloudflare-auth.outputs.ready == 'true'
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production 2D role gallery and story covers
        if: steps.cloudflare-auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base='https://sirole.vip'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          expected="$(node -e "const s=require('fs').readFileSync('config/app.js','utf8');const m=s.match(/const version='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          for attempt in $(seq 1 30); do
            curl -fsSL --retry 2 --retry-all-errors "$base/config/app.js?smoke=${GITHUB_SHA}-$attempt" -o "$tmp/config.js" || true
            if grep -Fq "$expected" "$tmp/config.js"; then break; fi
            sleep 2
          done
          grep -Fq "$expected" "$tmp/config.js"
          grep -Fq 'LIAOTIAN_3D_ONLY=false' "$tmp/config.js"
          for path in index.html role-story-engine.js role-photo-collection.js assets/role-portraits/intl-sylvie.webp assets/role-portraits/intl-rosalie.webp; do
            curl -fsSL --retry 3 --retry-all-errors "$base/$path?smoke=${GITHUB_SHA}" -o "$tmp/$(basename "$path")"
            test -s "$tmp/$(basename "$path")"
          done
          grep -Fq 'role-photo-collection.js' "$tmp/index.html"
          if grep -Eq 'role-avatar-stage\.js|studio-bridge\.js' "$tmp/index.html"; then echo "Retired 3D runtime still linked" >&2; exit 1; fi
          echo '2D production gallery, story engine and self-hosted photo covers verified'
