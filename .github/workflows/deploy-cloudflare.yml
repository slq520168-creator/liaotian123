name: Deploy Cloudflare production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production-main
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate site and 3D human assets
        run: |
          npm test
          node scripts/validate.mjs
          npm run cf:check

      - name: Detect Cloudflare deployment credentials
        id: cloudflare-auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy main to Cloudflare Workers
        if: steps.cloudflare-auth.outputs.ready == 'true'
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify sirole.vip 3D runtime
        if: steps.cloudflare-auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base='https://sirole.vip'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          expected_build="$(node -e "const s=require('fs').readFileSync('config/app.js','utf8');const m=s.match(/const version='([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"

          fetch_text() {
            local path="$1"
            local out="$2"
            echo "Fetching $path"
            curl -fsSL --retry 6 --retry-all-errors "$base/$path?smoke=${GITHUB_SHA}" -o "$tmp/$out"
            test -s "$tmp/$out"
            echo "Fetched $path ($(wc -c < "$tmp/$out") bytes)"
          }

          verify_http_200() {
            local path="$1"
            local code
            echo "Checking $path"
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --retry 6 --retry-all-errors "$base/$path?smoke=${GITHUB_SHA}")"
            test "$code" = '200'
            echo "Verified $path HTTP $code"
          }

          fetch_text 'config/app.js' 'config.js'
          grep -Fq "$expected_build" "$tmp/config.js"
          echo "Verified production build $expected_build"

          fetch_text 'role-human-renderer.js' 'renderer.js'
          grep -Fq 'class HumanRenderer' "$tmp/renderer.js"

          fetch_text 'role-human-asset-capability.js' 'capability.js'
          grep -Fq 'REQUIRED_CAPABILITIES' "$tmp/capability.js"

          fetch_text 'role-natural-pose.js' 'pose.js'
          grep -Fq 'const ENABLED = false' "$tmp/pose.js"

          fetch_text 'role-custom-visual.js' 'custom-visual.js'
          grep -Fq 'reference-fallback' "$tmp/custom-visual.js"

          fetch_text 'assets/humans/manifest.json' 'manifest.json'
          grep -Fq '"nuannuan"' "$tmp/manifest.json"

          verify_http_200 'assets/humans/reference-mpfb.glb'
          verify_http_200 'assets/humans/reference-vitruvian-morph.glb'
          echo 'sirole.vip production 3D runtime verified'
