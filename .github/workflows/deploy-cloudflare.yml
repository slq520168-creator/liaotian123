name: Deploy Cloudflare production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production-main
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate site and 3D human assets
        run: |
          npm test
          node scripts/validate.mjs
          npm run cf:check

      - name: Detect Cloudflare deployment credentials
        id: cloudflare-auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy main to Cloudflare Workers
        if: steps.cloudflare-auth.outputs.ready == 'true'
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify sirole.vip 3D runtime
        if: steps.cloudflare-auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base='https://sirole.vip'
          curl -fsSL --retry 6 --retry-all-errors "$base/config/app.js?smoke=${GITHUB_SHA}" | grep -q '20261023-human-visible1'
          curl -fsSL --retry 6 --retry-all-errors "$base/role-human-renderer.js?smoke=${GITHUB_SHA}" | grep -q 'class HumanRenderer'
          curl -fsSL --retry 6 --retry-all-errors "$base/assets/humans/manifest.json?smoke=${GITHUB_SHA}" | grep -q '"nuannuan"'
          curl -fsSLI --retry 6 --retry-all-errors "$base/assets/humans/reference-mpfb.glb?smoke=${GITHUB_SHA}" | grep -Eq '^HTTP/[0-9.]+ 200'
