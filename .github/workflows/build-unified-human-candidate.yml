name: Build unified CC0 human candidate

on:
  push:
    paths:
      - '.github/workflows/build-unified-human-candidate.yml'
      - 'scripts/patch-charactercreator-face-targets.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  CHARACTER_CREATOR_SHA: 852e48f316b90a0937234886630e4fb4cdfd1f78
  EXTRA_TARGETS_SHA: 7eaba3453134385bb5ea9811ef0b33b85b4b556d
  BLENDER_VERSION: 5.2.2
  MPFB_VERSION: 2.0.18

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cc /tmp/extra /tmp/blender
          curl -fL --retry 5 "https://github.com/kblood/CharacterCreator/archive/${CHARACTER_CREATOR_SHA}.tar.gz" -o /tmp/cc.tar.gz
          tar -xzf /tmp/cc.tar.gz -C /tmp/cc --strip-components=1
          curl -fL --retry 5 "https://github.com/makehumancommunity/extra-targets/archive/${EXTRA_TARGETS_SHA}.tar.gz" -o /tmp/extra.tar.gz
          tar -xzf /tmp/extra.tar.gz -C /tmp/extra --strip-components=1
          curl -fL --retry 5 "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          test -x /tmp/blender/blender
          test -f /tmp/extra/assets/faceunits01/targets/faceunits/jawOpen.target
          test -f /tmp/extra/assets/visemes02/targets/visemes/viseme_PP.target

      - name: Install and verify MPFB extension
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/mpfb-ready
          /tmp/blender/blender --online-mode --command extension install --sync --enable mpfb
          /tmp/blender/blender -b --python-expr "import importlib,pathlib; m=importlib.import_module('bl_ext.blender_org.mpfb.services.humanservice'); print('MPFB HUMAN SERVICE', m.HumanService.__name__); pathlib.Path('/tmp/mpfb-ready').write_text('ok')"
          test -s /tmp/mpfb-ready

      - name: Fetch CharacterCreator CC0 system assets
        working-directory: /tmp/cc
        shell: bash
        run: |
          set -euo pipefail
          python blender/tools/fetch_mh_assets.py

      - name: Add ARKit 52 and Meta visemes to the same topology
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/patch-charactercreator-face-targets.py" /tmp/cc/blender/build_base.py
          grep -q 'ARKIT_TARGET_NAMES' /tmp/cc/blender/build_base.py
          grep -q 'META_VISEME_NAMES' /tmp/cc/blender/build_base.py

      - name: Build unified candidate from clean output
        working-directory: /tmp/cc
        shell: bash
        env:
          CC_EXTRA_TARGETS: /tmp/extra/assets
        run: |
          set -euo pipefail
          rm -rf output build/blend
          mkdir -p output build/blend
          rm -f /tmp/cc-build-ready /tmp/candidate-build.log
          cat >/tmp/run-cc-build.py <<'PY'
          import pathlib
          import runpy
          import sys

          from bl_ext.blender_org.mpfb.services.humanservice import HumanService
          print('MPFB HUMAN SERVICE FOR BUILD', HumanService.__name__)
          sys.argv = ['blender/build_base.py', '--', 'output/base_body.glb']
          runpy.run_path('blender/build_base.py', run_name='__main__')
          pathlib.Path('/tmp/cc-build-ready').write_text('ok')
          PY
          /tmp/blender/blender -b --python /tmp/run-cc-build.py 2>&1 | tee /tmp/candidate-build.log
          test -s /tmp/cc-build-ready
          ! grep -q '^Traceback (most recent call last):' /tmp/candidate-build.log
          grep -q 'BUILD' /tmp/candidate-build.log
          for f in \
            output/base_body.glb output/base_body.joints.json output/asset_licenses.json \
            output/hair.json output/hair_short02.glb output/hair_bob02.glb output/hair_long01.glb \
            output/hair_ponytail01.glb output/hair_braid01.glb output/hair_short04.glb \
            output/hair_bob01.glb output/hair_afro01.glb \
            output/clothing.json output/clothing_dress.glb output/clothing_jeans.glb \
            output/clothing_tshirt.glb output/clothing_hoodie.glb output/clothing_jacket.glb \
            output/clothing_skirt.glb output/clothing_shorts.glb output/clothing_shoes.glb; do
            test -s "$f"
          done

      - name: Enforce unified human contract
        working-directory: /tmp/cc
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'), b=fs.readFileSync('output/base_body.glb');
          if(b.toString('ascii',0,4)!=='glTF') throw new Error('candidate is not GLB');
          let off=12,g=null; while(off+8<=b.length){const len=b.readUInt32LE(off),type=b.readUInt32LE(off+4);off+=8;if(type===0x4E4F534A){g=JSON.parse(b.subarray(off,off+len).toString('utf8').replace(/\u0000+$/,''));break;}off+=len;} if(!g) throw new Error('missing GLB JSON');
          const names=new Set(); for(const mesh of g.meshes||[]){for(const n of mesh?.extras?.targetNames||[])names.add(String(n));for(const p of mesh.primitives||[])for(const n of p?.extras?.targetNames||[])names.add(String(n));}
          const arkit=['browDownLeft','browDownRight','browInnerUp','browOuterUpLeft','browOuterUpRight','cheekPuff','cheekSquintLeft','cheekSquintRight','eyeBlinkLeft','eyeBlinkRight','eyeLookDownLeft','eyeLookDownRight','eyeLookInLeft','eyeLookInRight','eyeLookOutLeft','eyeLookOutRight','eyeLookUpLeft','eyeLookUpRight','eyeSquintLeft','eyeSquintRight','eyeWideLeft','eyeWideRight','jawForward','jawLeft','jawOpen','jawRight','mouthClose','mouthDimpleLeft','mouthDimpleRight','mouthFrownLeft','mouthFrownRight','mouthFunnel','mouthLeft','mouthLowerDownLeft','mouthLowerDownRight','mouthPressLeft','mouthPressRight','mouthPucker','mouthRight','mouthRollLower','mouthRollUpper','mouthShrugLower','mouthShrugUpper','mouthSmileLeft','mouthSmileRight','mouthStretchLeft','mouthStretchRight','mouthUpperUpLeft','mouthUpperUpRight','noseSneerLeft','noseSneerRight','tongueOut'];
          const visemes=['viseme_sil','viseme_PP','viseme_FF','viseme_TH','viseme_DD','viseme_kk','viseme_CH','viseme_SS','viseme_nn','viseme_RR','viseme_aa','viseme_E','viseme_I','viseme_O','viseme_U'];
          const baseRequired=['gender_female','gender_male','weight_min','weight_max','muscle_min','muscle_max','height_short','height_tall','face_nose_width_decr','face_nose_width_incr','face_jaw_width_decr','face_jaw_width_incr','face_eye_size_decr','face_eye_size_incr','face_lips_decr','face_lips_incr'];
          const missingArkit=arkit.filter(n=>!names.has(n)),missingVisemes=visemes.filter(n=>!names.has(n)),missingBase=baseRequired.filter(n=>!names.has(n));
          const rawNodeNames=(g.nodes||[]).map(n=>String(n.name||'')).filter(Boolean);
          const nodeNames=rawNodeNames.map(n=>n.toLowerCase()), bones=['pelvis','spine_01','spine_02','spine_03','neck_01','head','upperarm_l','upperarm_r','thigh_l','thigh_r'],missingBones=bones.filter(n=>!nodeNames.includes(n));
          const hair=['short02','bob02','long01','ponytail01','braid01','short04','bob01','afro01'];
          const clothing=['dress','jeans','tshirt','hoodie','jacket','skirt','shorts','shoes'];
          const sizes=(kind,list)=>Object.fromEntries(list.map(id=>[id,fs.statSync(`output/${kind}_${id}.glb`).size]));
          let licenses=null,licenseError=''; try{licenses=JSON.parse(fs.readFileSync('output/asset_licenses.json','utf8'));}catch(error){licenseError=String(error?.message||error);}
          const report={
            source:{characterCreator:process.env.CHARACTER_CREATOR_SHA,extraTargets:process.env.EXTRA_TARGETS_SHA,mpfb:process.env.MPFB_VERSION,blender:process.env.BLENDER_VERSION},
            bytes:b.length,meshes:(g.meshes||[]).length,skins:(g.skins||[]).length,morphTargetNameCount:names.size,
            arkitCount:arkit.length-missingArkit.length,visemeCount:visemes.length-missingVisemes.length,
            missingArkit,missingVisemes,missingBase,missingBones,
            diagnostics:{nodeNames:rawNodeNames.sort(),targetNames:[...names].sort(),licenseError},
            modules:{hair:sizes('hair',hair),clothing:sizes('clothing',clothing)},
            licenseInventory:Boolean(licenses && typeof licenses==='object'),
            mobile:{validated:false,reason:'requires optimized production bundle plus real-device FPS/memory validation before promotion'}
          };
          fs.writeFileSync('output/unified-human-report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({arkitCount:report.arkitCount,visemeCount:report.visemeCount,morphTargetNameCount:report.morphTargetNameCount,skins:report.skins,missingArkit,missingVisemes,missingBase,missingBones,licenseError},null,2));
          if(missingArkit.length||missingVisemes.length||missingBase.length||missingBones.length||(g.skins||[]).length<1||names.size<150||!report.licenseInventory) throw new Error('unified human contract failed');
          NODE

      - name: Validate modular skeleton/morph compatibility and static mobile budget
        working-directory: /tmp/cc
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const MiB=1024*1024;
          const hair=['short02','bob02','long01','ponytail01','braid01','short04','bob01','afro01'];
          const clothing=['dress','jeans','tshirt','hoodie','jacket','skirt','shorts','shoes'];
          function glb(path){
            const b=fs.readFileSync(path); if(b.toString('ascii',0,4)!=='glTF')throw new Error(`not GLB: ${path}`);
            let off=12,json=null; while(off+8<=b.length){const len=b.readUInt32LE(off),type=b.readUInt32LE(off+4);off+=8;if(type===0x4E4F534A){json=JSON.parse(b.subarray(off,off+len).toString('utf8').replace(/\u0000+$/,''));break;}off+=len;}
            if(!json)throw new Error(`missing JSON chunk: ${path}`); return {json,bytes:b.length};
          }
          const norm=s=>String(s||'').replace(/[^a-z0-9]/gi,'').toLowerCase();
          const targets=g=>{const out=new Set();for(const m of g.meshes||[]){for(const n of m?.extras?.targetNames||[])out.add(String(n));for(const p of m.primitives||[])for(const n of p?.extras?.targetNames||[])out.add(String(n));}return out;};
          const joints=g=>{const out=new Set();for(const skin of g.skins||[])for(const i of skin.joints||[]){const n=g.nodes?.[i]?.name;if(n)out.add(norm(n));}return out;};
          const base=glb('output/base_body.glb'), baseJoints=joints(base.json);
          if(baseJoints.size<20)throw new Error(`base skeleton too small: ${baseJoints.size}`);
          const bodyRequired=['gender_female','gender_male','weight_min','weight_max','height_short','height_tall'];
          const hairFaceRequired=['face_forehead_decr','face_forehead_incr','face_ear_size_decr','face_ear_size_incr'];
          function inspect(kind,id){
            const path=`output/${kind}_${id}.glb`, item=glb(path), js=joints(item.json), ts=targets(item.json);
            if(!(item.json.skins||[]).length)throw new Error(`${path}: no skin`);
            const missingBones=[...js].filter(n=>!baseJoints.has(n));
            if(missingBones.length)throw new Error(`${path}: bones not in base skeleton: ${missingBones.slice(0,12).join(',')}`);
            const required=kind==='hair'?[...bodyRequired,...hairFaceRequired]:bodyRequired;
            const missingMorphs=required.filter(n=>!ts.has(n));
            if(missingMorphs.length)throw new Error(`${path}: missing shared morphs: ${missingMorphs.join(',')}`);
            return {id,bytes:item.bytes,skins:(item.json.skins||[]).length,joints:js.size,morphTargets:ts.size};
          }
          const hairReport=hair.map(id=>inspect('hair',id));
          const clothingReport=clothing.map(id=>inspect('clothing',id));
          const largestHair=Math.max(...hairReport.map(x=>x.bytes));
          const largestClothing=Math.max(...clothingReport.map(x=>x.bytes));
          const worstInitial=base.bytes+largestHair+largestClothing;
          const budget={baseMax:14*MiB,moduleMax:6*MiB,worstInitialMax:22*MiB,baseBytes:base.bytes,largestHairBytes:largestHair,largestClothingBytes:largestClothing,worstInitialBytes:worstInitial};
          const staticBudgetPassed=base.bytes<=budget.baseMax&&largestHair<=budget.moduleMax&&largestClothing<=budget.moduleMax&&worstInitial<=budget.worstInitialMax;
          const report=JSON.parse(fs.readFileSync('output/unified-human-report.json','utf8'));
          report.modularCompatibility={passed:true,hair:hairReport,clothing:clothingReport};
          report.mobile={...report.mobile,staticBudgetPassed,budget};
          fs.writeFileSync('output/unified-human-report.json',JSON.stringify(report,null,2)+'\n');
          const manifest={schema:1,status:'candidate-only',license:'CC0',source:report.source,base:{url:'base_body.glb',bytes:base.bytes},modules:{hair:Object.fromEntries(hairReport.map(x=>[x.id,{url:`hair_${x.id}.glb`,bytes:x.bytes}])),clothing:Object.fromEntries(clothingReport.map(x=>[x.id,{url:`clothing_${x.id}.glb`,bytes:x.bytes}]))},capabilities:{skeleton:true,body:true,faceIdentity:true,expressions:true,visemes:true,hair:true,clothing:true,mobile:false},mobile:{validated:false,staticBudgetPassed,budget,reason:'static payload budget is not a substitute for real iPhone/Android FPS and memory validation'}};
          fs.writeFileSync('output/unified-human-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify({modularCompatibility:true,staticBudgetPassed,budget},null,2));
          if(!staticBudgetPassed)throw new Error('candidate exceeds static mobile payload budget; optimize before promotion');
          NODE

      - name: Upload diagnostics even when the build or contract fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-cc0-human-diagnostics
          path: |
            /tmp/cc/output/unified-human-report.json
            /tmp/candidate-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Collect validated candidate without promoting it to production
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidate
          mkdir -p candidate
          for f in \
            base_body.glb base_body.joints.json hair.json clothing.json unified-human-report.json unified-human-manifest.json asset_licenses.json \
            hair_short02.glb hair_bob02.glb hair_long01.glb hair_ponytail01.glb hair_braid01.glb hair_short04.glb hair_bob01.glb hair_afro01.glb \
            clothing_dress.glb clothing_jeans.glb clothing_tshirt.glb clothing_hoodie.glb clothing_jacket.glb clothing_skirt.glb clothing_shorts.glb clothing_shoes.glb; do
            test -s "/tmp/cc/output/$f"
            cp "/tmp/cc/output/$f" candidate/
          done
          cp /tmp/candidate-build.log candidate/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: unified-cc0-human-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Persist only the fully validated CC0 candidate on latest main
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -rf assets/humans/unified
          mkdir -p assets/humans/unified
          for f in \
            base_body.glb base_body.joints.json hair.json clothing.json unified-human-report.json unified-human-manifest.json asset_licenses.json \
            hair_short02.glb hair_bob02.glb hair_long01.glb hair_ponytail01.glb hair_braid01.glb hair_short04.glb hair_bob01.glb hair_afro01.glb \
            clothing_dress.glb clothing_jeans.glb clothing_tshirt.glb clothing_hoodie.glb clothing_jacket.glb clothing_skirt.glb clothing_shorts.glb clothing_shoes.glb; do
            test -s "candidate/$f"
            cp "candidate/$f" "assets/humans/unified/$f"
          done
          node -e "const m=require('./assets/humans/unified/unified-human-manifest.json');if(m.status!=='candidate-only'||m.license!=='CC0'||m.capabilities.mobile!==false||m.mobile.validated!==false||m.mobile.staticBudgetPassed!==true)process.exit(1)"
          git add -- assets/humans/unified
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Store validated unified CC0 human candidate'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install production deploy dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Revalidate site with persisted unified assets
        run: |
          set -euo pipefail
          npm test
          node scripts/validate.mjs
          npm run cf:check
          test -s assets/humans/unified/base_body.glb
          test -s assets/humans/unified/unified-human-manifest.json

      - name: Deploy persisted candidate assets to existing Cloudflare production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run cf:deploy

      - name: Verify persisted candidate assets on sirole.vip without enabling 3D chat
        shell: bash
        run: |
          set -euo pipefail
          base='https://sirole.vip/assets/humans/unified'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fetch() {
            local file="$1"
            local code
            for attempt in $(seq 1 20); do
              code="$(curl -sS -L -o "$tmp/$file" -w '%{http_code}' --retry 2 --retry-all-errors "$base/$file?candidate=${GITHUB_RUN_ID}-$attempt" || true)"
              if [ "$code" = '200' ] && [ -s "$tmp/$file" ]; then return 0; fi
              sleep 2
            done
            echo "candidate asset failed: $file" >&2
            return 1
          }
          fetch unified-human-manifest.json
          node -e "const fs=require('fs'),m=JSON.parse(fs.readFileSync('$tmp/unified-human-manifest.json'));if(m.status!=='candidate-only'||m.license!=='CC0'||m.capabilities.mobile!==false||m.mobile.validated!==false||m.mobile.staticBudgetPassed!==true)process.exit(1)"
          for file in base_body.glb hair_long01.glb hair_short04.glb hair_ponytail01.glb clothing_tshirt.glb clothing_dress.glb clothing_jacket.glb clothing_shoes.glb; do
            fetch "$file"
            test "$(wc -c < "$tmp/$file")" -gt 100000
          done
          echo 'Persisted unified CC0 candidate assets are live; mobile gate remains closed.'
