<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Studio - AI 角色创建平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 导航栏 -->
  <header class="navbar">
    <div class="container">
      <div class="brand">
        <h1>Character Studio</h1>
        <p class="tagline">创建 · 管理 · 互动</p>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-link active">创建角色</a>
        <a href="#gallery" class="nav-link">角色库</a>
        <a href="#about" class="nav-link">关于</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 英雄区块 -->
    <section class="hero">
      <div class="hero-content">
        <h2>创建你的专属 AI 角色</h2>
        <p>一个专业的角色卡创建、管理和交互平台</p>
      </div>
    </section>

    <!-- 主容器 -->
    <div class="main-container">
      <!-- 左侧编辑面板 -->
      <aside class="editor-panel">
        <div class="panel-header">
          <h3>角色编辑</h3>
          <p class="panel-subtitle">设置基本信息</p>
        </div>

        <!-- 快捷模板 -->
        <section class="section">
          <h4 class="section-title">快速模板</h4>
          <div class="templates-grid" id="presetsContainer"></div>
        </section>

        <!-- 头像上传 -->
        <section class="section">
          <h4 class="section-title">头像</h4>
          <div class="avatar-upload">
            <div class="avatar-container" id="avatarPreview">
              <img id="avatarImg" src="" alt="头像">
            </div>
            <input type="file" id="avatarInput" accept="image/*">
            <button class="btn-upload" id="uploadAvatarBtn">选择图片</button>
          </div>
        </section>

        <!-- 基本信息 -->
        <section class="section">
          <h4 class="section-title">基本信息</h4>
          <div class="form-group">
            <label for="name">角色名字</label>
            <input type="text" id="name" placeholder="输入角色名字" class="input-field">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="age">年龄</label>
              <input type="number" id="age" min="1" max="100" value="18" class="input-field">
            </div>
            <div class="form-group">
              <label for="height">身高</label>
              <input type="text" id="height" placeholder="如 165cm" class="input-field">
            </div>
          </div>
        </section>

        <!-- 外观描述 -->
        <section class="section">
          <h4 class="section-title">外观</h4>
          <textarea id="appearance" class="textarea-field" placeholder="描述角色的外观、气质、风格..." rows="3"></textarea>
        </section>

        <!-- 性格标签 -->
        <section class="section">
          <h4 class="section-title">性格特质</h4>
          <div class="tags-group" id="tagList">
            <label class="tag-item">
              <input type="checkbox" value="温和">
              <span>温和</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="善解人意">
              <span>善解人意</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="细心">
              <span>细心</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="开朗">
              <span>开朗</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="耐心">
              <span>耐心</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="幽默">
              <span>幽默</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="可爱">
              <span>可爱</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="体贴">
              <span>体贴</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="独立">
              <span>独立</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="性感">
              <span>性感</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="神秘">
              <span>神秘</span>
            </label>
            <label class="tag-item">
              <input type="checkbox" value="活泼">
              <span>活泼</span>
            </label>
          </div>
        </section>

        <!-- 说话风格 -->
        <section class="section">
          <h4 class="section-title">说话风格</h4>
          <textarea id="tone" class="textarea-field" placeholder="描述角色的说话方式、用词习惯..." rows="2"></textarea>
        </section>

        <!-- 角色背景 -->
        <section class="section">
          <h4 class="section-title">背景故事</h4>
          <textarea id="background" class="textarea-field" placeholder="角色的身份、经历、性格成因..." rows="3"></textarea>
        </section>

        <!-- 角色卡样式 -->
        <section class="section">
          <h4 class="section-title">卡片风格</h4>
          <select id="cardStyle" class="select-field">
            <option value="classic">经典风格</option>
            <option value="dreamy">梦幻风格</option>
            <option value="soft">柔和风格</option>
            <option value="dark">高级风格</option>
          </select>
        </section>

        <!-- 操作按钮 -->
        <div class="action-buttons">
          <button class="btn btn-primary" id="saveBtn">保存角色</button>
          <button class="btn btn-secondary" id="loadBtn">加载角色</button>
          <button class="btn btn-ghost" id="resetBtn">重置</button>
        </div>
      </aside>

      <!-- 右侧预览区 -->
      <section class="preview-section">
        <!-- 角色卡片 -->
        <div class="character-card-wrapper">
          <div class="character-card" id="previewCard">
            <div class="card-header">
              <div class="card-avatar-large">
                <img id="previewAvatar" src="" alt="角色头像">
              </div>
              <div class="card-info">
                <h2 id="previewName">未命名</h2>
                <p class="card-meta" id="previewMeta">年龄 - / 身高 -</p>
                <div class="card-tags" id="previewTags"></div>
              </div>
            </div>

            <div class="card-divider"></div>

            <div class="card-content">
              <div class="card-section">
                <h4>外观气质</h4>
                <p id="previewAppearance">外观描述</p>
              </div>

              <div class="card-section">
                <h4>说话风格</h4>
                <p id="previewTone">说话风格</p>
              </div>

              <div class="card-section">
                <h4>背景故事</h4>
                <p id="previewBackground">背景故事</p>
              </div>
            </div>
          </div>
        </div>

        <!-- 对话区块 -->
        <div class="chat-wrapper">
          <div class="chat-header">
            <h3 id="chatTitle">与角色对话</h3>
            <p class="chat-subtitle">测试您创建的角色</p>
          </div>

          <div class="messages-container" id="messages">
            <div class="message bot-message">
              <div class="message-bubble">
                <p>你好，很高兴认识你！</p>
              </div>
            </div>
          </div>

          <div class="chat-input-area">
            <textarea id="chatInput" class="chat-input" placeholder="输入您的消息..." rows="2"></textarea>
            <button id="sendBtn" class="btn-send">发送</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- 角色库模态框 -->
  <div id="characterModal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>已保存的角色</h3>
        <button class="btn-close" id="closeModalBtn">&times;</button>
      </div>
      <div id="charactersList" class="characters-gallery"></div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Character Studio. 创建和分享您的 AI 角色。</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
