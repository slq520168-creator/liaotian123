<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#fff0f5">
  <meta name="application-name" content="角色聊天">
  <meta name="apple-mobile-web-app-title" content="角色聊天">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>角色聊天</title>
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="favicon.ico?v=20261003-logo1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=20261003-logo1">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261003-logo1">
  <link rel="manifest" href="manifest.webmanifest?v=20261003-logo1">
  <link rel="preconnect" href="https://afzcohtnljnmucrkgcaz.supabase.co" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261003-roles1">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏：角色列表与管理 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img class="site-logo" src="assets/brand/logo-96.png" alt="角色聊天 Logo" width="36" height="36">
        <h2>角色中心</h2>
        <button class="icon-btn close-sidebar-btn" id="closeSidebarBtn" title="关闭侧边栏">&times;</button>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-primary btn-block" id="openCreateModalBtn">
          <span class="icon">+</span> 创建新角色
        </button>
        <button class="btn btn-outline btn-block" id="uploadRoleCodeBtn" type="button">上传角色代码</button>
        <p id="roleCodeStatus" class="form-hint" role="status"></p>
        <button class="btn btn-secondary btn-block" id="openMemoryBtn" type="button">资料与记忆</button>
        <a class="guide-link" href="docs/index.html" target="_blank" rel="noopener">使用指南</a>
      </div>

      <div class="sidebar-characters">
        <div class="character-section">
          <h3 id="presetRoleTitle">角色</h3>
          <div class="character-list" id="presetCharacterList">
            <!-- 预设角色由 JS 动态渲染 -->
          </div>
        </div>

        <div class="character-section">
          <h3>我的角色</h3>
          <div class="character-list" id="customCharacterList">
            <!-- 自定义角色由 JS 动态渲染 -->
          </div>
        </div>
      </div>
    </aside>

    <!-- 侧边栏遮罩 (移动端) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 主聊天界面 -->
    <main class="chat-main">
      <header class="chat-header">
        <button class="icon-btn menu-btn" id="openSidebarBtn" title="打开角色菜单" aria-label="打开角色菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <div class="current-character-info" id="currentCharacterInfo">
          <button class="message-avatar-button" id="roleDetailsBtn" type="button" aria-label="查看当前角色人设与相处偏好"><img src="assets/avatars/nuannuan-portrait.jpg" alt="头像" class="avatar avatar-sm" id="headerAvatar"></button>
          <div class="char-details">
            <h1 class="char-name" id="headerName">暖暖</h1>
            <span class="char-tag" id="headerTag">温柔亲密 · 女</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn btn-outline btn-sm" id="switchCharBtn">切换/创建角色</button>
          <button class="icon-btn" id="clearChatBtn" title="清空对话" aria-label="清空当前角色对话">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer">
        <div class="messages" id="messages">
          <!-- 消息历史由 JS 渲染 -->
        </div>
      </div>

      <div class="input-container">
        <div class="quick-replies" id="quickReplies">
          <!-- 快捷对话选项 -->
        </div>
        <div class="chat-tools">
          <button class="tool-btn" id="emojiBtn" type="button" aria-expanded="false" aria-controls="emojiPicker">😊 表情</button>
          <div class="chat-tool-group" id="chatStyleControls"></div>
          <div class="chat-tool-group">
          <label for="replyLength">回复</label>
          <select id="replyLength" aria-label="回复长短">
            <option value="auto">随聊随回</option>
            <option value="short">短一点</option>
            <option value="long">认真长聊</option>
          </select>
          </div>
        </div>
        <div id="emojiPicker" class="emoji-picker" hidden></div>
        <div class="composer-row">
          <button class="user-avatar-button" id="changeUserAvatarBtn" type="button" aria-label="从相册设置我的头像" title="从相册设置我的头像">
            <img class="avatar" id="userAvatarPreview" src="assets/avatars/user.svg" alt="我的头像">
            <span>头像</span>
          </button>
          <div class="input-area">
          <textarea id="userInput" placeholder="给角色发送消息..." aria-label="聊天消息" rows="1" maxlength="30000"></textarea>
          <button id="sendBtn" class="btn btn-send" title="发送消息（Enter 发送，Shift+Enter 换行）" disabled>
            <span>发送</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
          </div>
        </div>
        <input type="file" id="userAvatarUpload" accept="image/*" aria-label="选择我的头像照片" hidden>
        <div class="avatar-upload-status" id="avatarUploadStatus" role="status" aria-live="polite"></div>
        <div class="reply-status" id="replyStatus" role="status" aria-live="polite"></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="roleCodeModalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="roleCodeTitle">
      <div class="modal-header"><h2 id="roleCodeTitle">角色代码</h2><button class="icon-btn" id="closeRoleCodeBtn" type="button" aria-label="关闭角色代码">&times;</button></div>
      <form id="roleCodeForm" class="modal-body">
        <div id="roleCodeTargetControls" class="form-group"></div>
        <div class="role-code-toolbar">
          <button class="btn btn-primary" id="chooseRoleCodeFileBtn" type="button">上传文件</button>
          <button class="btn btn-outline" id="useRoleCodeTemplateBtn" type="button">使用模板</button>
          <button class="btn btn-outline" id="clearRoleCodeBtn" type="button">清空代码</button>
          <a class="template-link" href="roles/new-role.role.json" download>下载模板</a>
          <input type="file" id="roleCodeUpload" accept=".json,.js,application/json,text/javascript" hidden>
        </div>
        <div class="form-group">
          <label for="roleCodeEditor">编写或粘贴角色代码</label>
          <textarea class="role-code-editor" id="roleCodeEditor" rows="10" maxlength="524288" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="soft" placeholder="填写角色数据，例如 { name: '小雨', personality: '成熟坦率，喜欢读书' }；也支持 JSON 和 JS 对象" required></textarea>
        </div>
        <p class="form-hint" id="roleCodeEditorStatus" role="alert"></p>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelRoleCodeBtn" type="button">取消</button>
          <button class="btn btn-primary" id="generateRoleCodeBtn" type="submit" title="生成角色（Ctrl/Cmd + Enter）">生成角色</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="memoryModalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="memoryTitle">
      <div class="modal-header"><h2 id="memoryTitle">资料与记忆</h2><button type="button" class="icon-btn" id="closeMemoryBtn" aria-label="关闭资料">&times;</button></div>
      <div class="modal-body memory-layout">
        <section class="memory-panel" aria-label="我的资料">
        <div class="form-group"><label for="playerName">希望怎么称呼你</label><input id="playerName" maxlength="24" placeholder="例如：小禾"></div>
        <div class="form-group"><label for="playerAbout">希望一直记住的事</label><textarea id="playerAbout" rows="3" maxlength="600" placeholder="喜好、生日、宠物，以及你希望角色记得的生活细节"></textarea></div>
        <button class="btn btn-primary" id="savePlayerProfileBtn" type="button">保存我的资料</button>
        </section>
        <section class="memory-panel" aria-label="相处偏好与记忆">
        <div class="form-group"><label for="rolePreferences" id="rolePreferencesLabel">希望当前角色怎么和你相处</label><textarea id="rolePreferences" rows="3" maxlength="600" placeholder="例如：慢慢更温柔一些，少问问题，喜欢甜一点的语气"></textarea></div>
        <button class="btn btn-outline" id="saveRolePreferencesBtn" type="button">保存偏好</button>
        <div id="memoryFacts" class="memory-facts"></div>
        <button class="btn btn-outline" id="forgetRoleMemoryBtn" type="button" hidden>清除记忆</button>
        </section>
        <div class="memory-backup">
        <div class="backup-actions"><button class="btn btn-secondary" id="saveBackupBtn" type="button">记忆备份</button><button class="btn btn-secondary" id="restoreBackupBtn" type="button">恢复记忆</button></div>
        <input id="backupUpload" type="file" accept=".json,application/json" hidden>
        <p class="form-hint" id="memoryStatus" role="status"></p>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="roleDetailsOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="roleDetailsTitle">
      <div class="modal-header"><h2 id="roleDetailsTitle">角色人设</h2><button type="button" class="icon-btn" id="closeRoleDetailsBtn" aria-label="关闭人设">&times;</button></div>
      <div class="modal-body"><div id="roleDetailsContent" class="role-details-content"></div><button class="btn btn-primary" id="adjustRoleBtn" type="button">相处偏好</button></div>
    </div>
  </div>

  <!-- 创建角色弹窗 -->
  <div class="modal-overlay" id="createModalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createRoleTitle">
      <div class="modal-header">
        <h2 id="createRoleTitle">创建新角色</h2>
        <button class="icon-btn close-modal-btn" id="closeModalBtn" aria-label="关闭创建角色">&times;</button>
      </div>
      <form id="createRoleForm" class="modal-body">
        <div class="form-group">
          <label for="roleName">角色姓名 <span class="required">*</span></label>
          <input type="text" id="roleName" placeholder="例如：云舟" required maxlength="12">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="roleGender">角色性别</label>
            <select id="roleGender">
              <option value="unspecified">不指定</option>
              <option value="male">男</option>
              <option value="female">女</option>
            </select>
          </div>
          <div class="form-group">
            <label for="roleAge">角色年龄</label>
            <input type="number" id="roleAge" min="18" max="100" value="24" required>
          </div>
        </div>

        <div class="form-group form-span-full">
          <label>角色头像 <span class="required">*</span></label>
          <div class="avatar-picker">
            <div class="avatar-upload-row">
              <img id="roleAvatarPreview" class="avatar avatar-upload-preview" src="assets/avatars/nuannuan-portrait.jpg" alt="所选角色头像">
              <div class="avatar-upload-controls">
                <button type="button" id="chooseRoleAvatarBtn" class="btn btn-outline">从相册选择</button>
                <input type="file" id="roleAvatarUpload" accept="image/*" aria-label="选择角色头像照片" hidden>
                <p id="roleAvatarStatus" class="form-hint" role="status" aria-live="polite"></p>
              </div>
            </div>
            <div class="preset-avatars" id="presetAvatarPicker"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="roleTag">角色标签 <span class="required">*</span></label>
          <input type="text" id="roleTag" placeholder="例如：高冷学霸、幽默老友、古风侠客" required maxlength="20">
        </div>

        <div class="form-group">
          <label for="roleGreeting">首句问候语 <span class="required">*</span></label>
          <input type="text" id="roleGreeting" placeholder="例如：今天有什么有趣的事要和我分享吗？" required maxlength="300">
        </div>

        <div class="form-group form-span-full">
          <label for="rolePersonality">性格特征与人设描述 <span class="required">*</span></label>
          <textarea id="rolePersonality" rows="4" placeholder="性格、背景与相处习惯" required maxlength="12000"></textarea>
        </div>

        <div class="form-group">
          <label for="roleVoice">说话习惯</label>
          <input type="text" id="roleVoice" placeholder="例如：直白温柔，有一点幽默，不爱说大道理" maxlength="240">
        </div>

        <div class="form-group">
          <label for="roleInterests">爱好与日常</label>
          <input type="text" id="roleInterests" placeholder="例如：电影、旅行、做饭，喜欢聊生活里的小事" maxlength="240">
        </div>

        <div class="form-group form-span-full">
          <label for="roleRelationship">相处方式</label>
          <textarea id="roleRelationship" rows="2" placeholder="例如：像熟悉的朋友，记得我说过的话；需要安静时不追问" maxlength="300"></textarea>
        </div>

        <p class="form-hint form-span-full" id="createRoleStatus" role="alert"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelModalBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="createRoleSubmitBtn">创建角色</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config/app.js?v=20261003-7" defer></script>
  <script src="roles.js?v=20261003-mature2" defer></script>
  <script src="memory.js?v=20261003-6" defer></script>
  <script src="role-code.js?v=20261003-code2" defer></script>
  <script src="app.js?v=20261003-chat2" defer></script>
</body>
</html>
