<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#fff0f5">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https://*.supabase.co https://text.pollinations.ai https://vireonix.ai https://ai-api.cehpoint.co.in https://api.llmfaucet.dev; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  <script src="studio-launcher.js"></script>
  <meta name="application-name" content="角色聊天">
  <meta name="apple-mobile-web-app-title" content="角色聊天">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>角色聊天</title>
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="favicon.ico?v=20261003-logo1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png?v=20261003-logo1">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261003-logo1">
  <link rel="manifest" href="manifest.webmanifest?v=20261003-logo1">
  <link rel="preconnect" href="https://afzcohtnljnmucrkgcaz.supabase.co" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261117-create3d53">
  <link rel="stylesheet" href="role-discovery.css?v=20261123-discover01">
  <link rel="stylesheet" href="role-chat-immersive.css?v=20261123-discover01">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img class="site-logo" src="assets/brand/logo-96.png" alt="角色聊天 Logo" width="36" height="36">
        <h2>角色中心</h2>
        <button class="icon-btn close-sidebar-btn" id="closeSidebarBtn" title="关闭侧边栏">&times;</button>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-primary btn-block" id="openCreateModalBtn">
          <span class="icon">+</span> 创建3D角色
        </button>
        <button class="btn btn-outline btn-block" id="uploadRoleCodeBtn" type="button">上传角色代码</button>
        <p id="roleCodeStatus" class="form-hint" role="status"></p>
        <button class="btn btn-secondary btn-block" id="openMemoryBtn" type="button">资料与记忆</button>
        <a class="guide-link" href="docs/index.html" target="_blank" rel="noopener">使用指南</a>
      </div>

      <div class="sidebar-characters">
        <div class="character-section">
          <h3 id="presetRoleTitle">3D角色</h3>
          <div class="character-list" id="presetCharacterList"></div>
        </div>

        <div class="character-section">
          <h3>我的3D角色</h3>
          <div class="character-list" id="customCharacterList"></div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="chat-main">
      <div class="rd-chat-scene" aria-hidden="true"><img id="rdChatCover" src="assets/avatars/nuannuan-portrait.jpg" alt=""></div>
      <header class="chat-header">
        <button class="icon-btn menu-btn" id="openSidebarBtn" title="打开角色菜单" aria-label="打开角色菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <div class="current-character-info" id="currentCharacterInfo">
          <button class="message-avatar-button" id="roleDetailsBtn" type="button" aria-label="查看当前角色人设与相处偏好"><img src="assets/avatars/nuannuan-portrait.jpg" alt="头像" class="avatar avatar-sm" id="headerAvatar"></button>
          <div class="char-details">
            <h1 class="char-name" id="headerName">暖暖</h1>
            <span class="char-tag" id="headerTag">温柔亲密 · 女</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn rd-history-toggle" type="button" id="rdHistoryToggle" title="查看对话记录" aria-label="查看对话记录" aria-pressed="false">☷</button>
          <button class="btn btn-outline btn-sm" id="switchCharBtn">切换/创建角色</button>
          <button class="icon-btn" id="clearChatBtn" title="清空对话" aria-label="清空当前角色对话">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer">
        <div class="messages" id="messages"></div>
      </div>

      <aside id="rdLiveReply" class="rd-live-reply" aria-label="人物正在回复" aria-live="polite" hidden><div class="rd-reply-top"><span class="rd-speaking-indicator"></span><strong id="rdReplyName">暖暖</strong></div><p id="rdReplyText"></p><span class="rd-reply-typing" aria-hidden="true"><i></i><i></i><i></i></span></aside>
      <div class="input-container">
        <div class="quick-replies" id="quickReplies"></div>
        <div class="chat-tools">
          <button class="tool-btn" id="emojiBtn" type="button" aria-expanded="false" aria-controls="emojiPicker">😊 表情</button>
          <div class="chat-tool-group" id="chatStyleControls"></div>
          <div class="chat-tool-group">
          <label for="replyLength">回复</label>
          <select id="replyLength" aria-label="回复长短">
            <option value="auto">随聊随回</option>
            <option value="short">短一点</option>
            <option value="long">认真长聊</option>
          </select>
          </div>
        </div>
        <div id="emojiPicker" class="emoji-picker" hidden></div>
        <div class="composer-row">
          <button class="user-avatar-button" id="changeUserAvatarBtn" type="button" aria-label="从相册设置我的头像" title="从相册设置我的头像">
            <img class="avatar" id="userAvatarPreview" src="assets/avatars/user.svg" alt="我的头像">
            <span>头像</span>
          </button>
          <div class="input-area">
          <textarea id="userInput" placeholder="给角色发送消息..." aria-label="聊天消息" rows="1" maxlength="30000"></textarea>
          <button id="sendBtn" class="btn btn-send" title="发送消息（Enter 发送，Shift+Enter 换行）" disabled>
            <span>发送</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
          </div>
        </div>
        <input type="file" id="userAvatarUpload" accept="image/*" aria-label="选择我的头像照片" hidden>
        <div class="avatar-upload-status" id="avatarUploadStatus" role="status" aria-live="polite"></div>
        <div class="reply-status" id="replyStatus" role="status" aria-live="polite"></div>
      </div>
    </main>
  </div>

  <section id="roleDiscovery" aria-label="角色发现大厅" hidden>
    <div class="rd-container">
      <nav class="rd-nav" aria-label="角色大厅导航">
        <div class="rd-brand"><span class="rd-brand-mark" aria-hidden="true">♡</span><span class="rd-brand-text">Liaotian123</span></div>
        <div class="rd-nav-actions"><button type="button" class="rd-header-button rd-primary" id="rdCreateRole">＋ 创建角色</button></div>
      </nav>
      <div class="rd-intro">
        <span class="rd-eyebrow">CHARACTER · STORY · CONNECTION</span>
        <h1>她（他）只差<em>一条消息。</em></h1>
        <p>发现喜欢的角色，让故事从第一句对话开始。</p>
      </div>
      <div class="rd-stage">
        <div class="rd-deck">
          <span class="rd-deck-counter" id="rdDeckCounter" aria-label="当前角色序号">01 / 12</span>
          <div class="rd-card" id="rdHeroCard" role="button" tabindex="0" aria-label="选择角色，左右滑动切换">
            <img id="rdHeroPortrait" src="assets/avatars/nuannuan-portrait.jpg" alt="当前角色形象" fetchpriority="high">
            <video id="rdHeroVideo" class="rd-character-video" aria-label="角色视频预览" autoplay loop muted playsinline preload="metadata" hidden></video>
            <span class="rd-character-tag" id="rdHeroTag">人物角色</span>
            <div class="rd-card-info"><div class="rd-card-title"><strong id="rdHeroName">暖暖</strong><span class="rd-age" id="rdHeroAge">24</span></div><p class="rd-card-bio" id="rdHeroBio"></p></div>
          </div>
          <div id="rdHeroEmpty" class="rd-card-empty" hidden>没有找到对应角色，试试其他筛选条件。</div>
          <div class="rd-control-row" id="rdHeroControls" aria-label="切换与收藏角色">
            <button id="rdPrevious" type="button" class="rd-control" aria-label="上一个角色">‹</button>
            <button id="rdFavorite" type="button" class="rd-control rd-favorite" aria-label="收藏当前角色" aria-pressed="false">♥</button>
            <button id="rdNext" type="button" class="rd-control" aria-label="下一个角色">›</button>
          </div>
        </div>
      </div>
      <button id="rdStartChat" class="rd-cta" type="button">开始聊天</button>
      <p class="rd-hint">左右滑动切换角色 · 点击人物开启对话</p>
      <section class="rd-gallery" aria-label="探索所有角色">
        <div class="rd-gallery-title"><h2>探索角色</h2><span id="rdGridCount">12 位角色</span></div>
        <label class="rd-search-wrap" for="rdSearch"><span aria-hidden="true">⌕</span><input id="rdSearch" class="rd-search" type="search" placeholder="搜索角色名字、性格或兴趣" autocomplete="off" maxlength="80"></label>
        <div class="rd-filters" role="group" aria-label="角色分类">
          <button type="button" class="rd-filter is-active" data-role-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="rd-filter" data-role-filter="female" aria-pressed="false">女性角色</button>
          <button type="button" class="rd-filter" data-role-filter="male" aria-pressed="false">男性角色</button>
          <button type="button" class="rd-filter" data-role-filter="liked" aria-pressed="false">我喜欢的</button>
          <button type="button" class="rd-filter" data-role-filter="mine" aria-pressed="false">我的角色</button>
        </div>
        <div class="rd-character-grid" id="rdCharacterGrid"></div>
        <div class="rd-grid-empty" id="rdGridEmpty" hidden><p>这里还没有角色。</p><button type="button" class="rd-header-button" id="rdCreateEmpty">创建我的角色</button></div>
      </section>
    </div>
  </section>

  <div class="modal-overlay" id="roleCodeModalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="roleCodeTitle">
      <div class="modal-header"><h2 id="roleCodeTitle">角色代码</h2><button class="icon-btn" id="closeRoleCodeBtn" type="button" aria-label="关闭角色代码">&times;</button></div>
      <form id="roleCodeForm" class="modal-body">
        <div id="roleCodeTargetControls" class="form-group"></div>
        <div class="role-code-toolbar">
          <button class="btn btn-primary" id="chooseRoleCodeFileBtn" type="button">上传文件</button>
          <button class="btn btn-outline" id="useRoleCodeTemplateBtn" type="button">使用模板</button>
          <button class="btn btn-outline" id="clearRoleCodeBtn" type="button">清空代码</button>
          <a class="template-link" href="roles/new-role.role.json" download>下载模板</a>
          <input type="file" id="roleCodeUpload" accept=".json,.js,application/json,text/javascript" hidden>
        </div>
        <div class="form-group">
          <label for="roleCodeEditor">编写或粘贴角色代码</label>
          <textarea class="role-code-editor" id="roleCodeEditor" rows="10" maxlength="524288" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="soft" placeholder="填写3D角色数据；支持 JSON 和 JS 对象" required></textarea>
        </div>
        <p class="form-hint" id="roleCodeEditorStatus" role="alert"></p>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancelRoleCodeBtn" type="button">取消</button>
          <button class="btn btn-primary" id="generateRoleCodeBtn" type="submit" title="生成角色（Ctrl/Cmd + Enter）">生成3D角色</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="memoryModalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="memoryTitle">
      <div class="modal-header"><h2 id="memoryTitle">资料与记忆</h2><button type="button" class="icon-btn" id="closeMemoryBtn" aria-label="关闭资料">&times;</button></div>
      <div class="modal-body memory-layout">
        <section class="memory-panel" aria-label="我的资料">
        <div class="form-group"><label for="playerName">希望怎么称呼你</label><input id="playerName" maxlength="24" placeholder="例如：小禾"></div>
        <div class="form-group"><label for="playerAbout">希望一直记住的事</label><textarea id="playerAbout" rows="3" maxlength="600" placeholder="喜好、生日、宠物，以及你希望角色记得的生活细节"></textarea></div>
        <button class="btn btn-primary" id="savePlayerProfileBtn" type="button">保存我的资料</button>
        </section>
        <section class="memory-panel" aria-label="相处偏好与记忆">
        <div class="form-group"><label for="rolePreferences" id="rolePreferencesLabel">希望当前角色怎么和你相处</label><textarea id="rolePreferences" rows="3" maxlength="600" placeholder="例如：慢慢更温柔一些，少问问题，喜欢甜一点的语气"></textarea></div>
        <button class="btn btn-outline" id="saveRolePreferencesBtn" type="button">保存偏好</button>
        <div id="memoryFacts" class="memory-facts"></div>
        <button class="btn btn-outline" id="forgetRoleMemoryBtn" type="button" hidden>清除记忆</button>
        </section>
        <div class="memory-backup">
        <div class="backup-actions"><button class="btn btn-secondary" id="saveBackupBtn" type="button">记忆备份</button><button class="btn btn-secondary" id="restoreBackupBtn" type="button">恢复记忆</button></div>
        <input id="backupUpload" type="file" accept=".json,application/json" hidden>
        <p class="form-hint" id="memoryStatus" role="status"></p>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="roleDetailsOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="roleDetailsTitle">
      <div class="modal-header"><h2 id="roleDetailsTitle">角色人设</h2><button type="button" class="icon-btn" id="closeRoleDetailsBtn" aria-label="关闭人设">&times;</button></div>
      <div class="modal-body"><div id="roleDetailsContent" class="role-details-content"></div><button class="btn btn-primary" id="adjustRoleBtn" type="button">相处偏好</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="createModalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createRoleTitle">
      <div class="modal-header">
        <h2 id="createRoleTitle">3D 人物大厅</h2>
        <button class="icon-btn close-modal-btn" id="closeModalBtn" aria-label="关闭3D人物大厅">&times;</button>
      </div>
      <form id="createRoleForm" class="modal-body creator-3d-only">
        <div id="roleCreatorCompat" hidden aria-hidden="true" style="display:none!important">
          <input type="text" id="roleName" required maxlength="12">
          <select id="roleGender"><option value="unspecified">不指定</option><option value="male">男</option><option value="female">女</option></select>
          <input type="number" id="roleAge" min="18" max="100" value="24" required>
          <img id="roleAvatarPreview" src="assets/avatars/nuannuan-portrait.jpg" alt="">
          <button type="button" id="chooseRoleAvatarBtn">选择头像</button>
          <input type="file" id="roleAvatarUpload" accept="image/*" hidden>
          <p id="roleAvatarStatus"></p>
          <div id="presetAvatarPicker"></div>
          <input type="text" id="roleTag" required maxlength="20">
          <input type="text" id="roleGreeting" required maxlength="300">
          <textarea id="rolePersonality" required maxlength="12000"></textarea>
          <input type="text" id="roleVoice" maxlength="240">
          <input type="text" id="roleInterests" maxlength="240">
          <textarea id="roleRelationship" maxlength="300"></textarea>
          <p id="createRoleStatus" role="alert"></p>
          <button type="button" id="cancelModalBtn">取消</button>
          <button type="submit" id="createRoleSubmitBtn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="studio/api.js" defer></script>
  <script src="config/app.js?v=20261117-create3d53" defer></script>
  <script src="roles.js?v=20261117-create3d53" defer></script>
  <script src="memory.js?v=20261117-create3d53" defer></script>
  <script src="role-code.js?v=20261117-create3d53" defer></script>
  <script src="app.js?v=20261117-create3d53" defer></script>
  <script src="role-discovery.js?v=20261123-discover01" defer></script>
  <script src="studio-bridge.js" defer></script>
</body>
</html>
