<body data-state="loading">
<main>

  <p class="note">结果只保存在当前浏览器 sessionStorage，不上传用户数据。真实移动端晋级必须同时满足：移动设备、WebGL2、完整候选合同、平均 ≥30 FPS、P95 ≤50ms、无上下文丢失。</p>
</main>
