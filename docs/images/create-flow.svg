<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 550" role="img" aria-labelledby="title desc"><title id="title">新角色生成流程</title><desc id="desc">选择预设直接聊天。表单创建和代码导入都经过验证，成功后保存角色，代码错误保留内容供修改。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44971"/></marker></defs><g fill="#fff8fb" stroke="#cf99b0" stroke-width="2"><rect x="330" y="20" width="260" height="64" rx="12"/><rect x="30" y="160" width="240" height="64" rx="12"/><rect x="340" y="160" width="240" height="64" rx="12"/><rect x="650" y="160" width="240" height="64" rx="12"/><rect x="340" y="310" width="240" height="64" rx="12"/><rect x="650" y="310" width="240" height="64" rx="12"/><rect x="340" y="460" width="240" height="64" rx="12"/></g><g fill="none" stroke="#a44971" stroke-width="2" marker-end="url(#arrow)"><path d="M460 84V115H150V160"/><path d="M460 84V160"/><path d="M460 115H770V160"/><path d="M150 224V492H340"/><path d="M460 224V310"/><path d="M770 224V260H460V310"/><path d="M460 374V460"/><path d="M580 342H650"/><path d="M770 310V224"/></g><g fill="#512e3e" font-family="sans-serif" font-size="24" text-anchor="middle"><text x="460" y="61">角色中心</text><text x="150" y="201">选择预设</text><text x="460" y="201">表单创建</text><text x="770" y="201">上传或编写代码</text><text x="460" y="351">验证并保存</text><text x="770" y="351">修改错误</text><text x="460" y="501">开始聊天</text></g><g fill="#805568" font-family="sans-serif" font-size="18"><text x="474" y="418">成功</text><text x="600" y="327">失败</text></g></svg>